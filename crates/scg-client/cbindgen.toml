language = "C"
include_guard = "SCG_CLIENT_H"
pragma_once = true
cpp_compat = true
documentation = true
documentation_style = "doxy"
style = "type"
autogen_warning = "/* Auto-generated by cbindgen from the scg-client crate. Run `cargo build -p scg-client` to regenerate; do not edit by hand. */"

[parse]
# The C ABI only uses primitive types and the crate's own opaque handle, so
# there is no need to parse dependency crates.
parse_deps = false

[export]
include = ["ScgClientHandle"]

[enum]
prefix_with_name = true
