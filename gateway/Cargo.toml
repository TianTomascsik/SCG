[package]
name = "gateway"
version = "0.1.0"
edition = "2021"
description = "Transparent TLS/kTLS encryption proxy gateway (POC)"

[features]
default = []
# Experimental, opt-in io_uring relay backend for the zero-copy splice data path
# (evaluation PoC). Off by default; when compiled in it is still gated at run time by
# the SCG_RELAY_IO_URING env var and falls back to the splice path if the ring
# cannot be created, so a feature-on build with the switch off is byte-identical
# to the default splice relay.
io_uring = ["dep:io-uring"]

[[bin]]
name = "gateway"
path = "src/main.rs"

[dependencies]
ale_pipe = { path = "../../ale-frame", package = "ale-frame" }
openssl = "0.10"
openssl-sys = "0.9"
libc = "0.2"
foreign-types-shared = "0.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
ktls_pipe = { path = "../crates/ktls_pipe" }
log = "0.4"
env_logger = "0.11"
# Optional: io_uring submission/completion backend for the splice relay (WP5 PoC).
# Only linked when the `io_uring` feature is enabled.
io-uring = { version = "0.7", optional = true }
# Zeroize WireGuard key material (private keys / PSKs) on drop — the only crypto
# the WireGuard provider holds in userspace, since the cipher work is offloaded
# to the kernel `wireguard` module. Apache-2.0/MIT.
zeroize = "1"

# Local-interface IPC primitives and management gRPC.
scg-ipc = { path = "../crates/scg-ipc" }
scg-proto = { path = "../crates/scg-proto" }
tonic = "0.12"
prost = "0.13"
# tokio/tokio-stream are used ONLY by the management thread (gRPC). The data
# plane stays synchronous (thread-per-rule, blocking I/O).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-stream = { version = "0.1", features = ["net"] }

[dev-dependencies]
# Integration tests drive the gateway through the real client library.
scg-client = { path = "../crates/scg-client" }
scg-ipc = { path = "../crates/scg-ipc" }
serde_json = "1"
libc = "0.2"
# Test PKI fixtures and raw TLS test clients (mTLS / verify / SNI tests).
openssl = "0.10"
