[workspace]
members = [
    # Open Secure Communication Gateway (library + binary)
    "gateway",

    # Shared infrastructure crates (consumed by the gateway and by the benches repo)
    "crates/ktls_pipe",
    "crates/tls_pipe",

    # Local-interface IPC primitives and gRPC management protocol
    "crates/scg-ipc",
    "crates/scg-proto",

    # Client library (Rust core + C/C++ ABI) for the local interfaces
    "crates/scg-client",

    # Benchmark logging/CSV helpers (consumed by the benches repo)
    "crates/bench_log",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
debug = 0
strip = "symbols"

# Profiling profile: identical codegen to `release` (opt-level 3, fat LTO,
# 1 codegen-unit, panic=abort are all inherited) but keeps DWARF + symbols so
# perf/flamegraphs resolve gateway frames instead of bare hex addresses.
# `collect_perf_data.sh` builds the gateway with this profile (plus
# `-C force-frame-pointers=yes`) for the flamegraph stage only; steady-state
# performance is within measurement noise of `release`.
[profile.profiling]
inherits = "release"
debug = 1
strip = "none"
split-debuginfo = "off"   # embed symbols in the binary so the perf bundle is self-contained
