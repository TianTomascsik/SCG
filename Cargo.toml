[workspace]
members = [
    # Open Secure Communication Gateway (library + binary)
    "gateway",

    # kTLS session primitives shared with the gateway data plane
    "crates/ktls_pipe",

    # Local-interface IPC primitives and gRPC management protocol
    "crates/scg-ipc",
    "crates/scg-proto",

    # Client library (Rust core + C/C++ ABI) for the local interfaces
    "crates/scg-client",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TianTomascsik/SCG"
authors = ["Tian Tomascsik <tian.tomascsik@gmail.com>"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
debug = 0
strip = "symbols"

# Profiling profile: identical codegen to `release` (opt-level 3, fat LTO,
# 1 codegen-unit, panic=abort are all inherited) but keeps DWARF + symbols so
# perf/flamegraphs resolve gateway frames instead of bare hex addresses.
# Build with `--profile profiling` (optionally with
# `RUSTFLAGS=-Cforce-frame-pointers=yes`) when collecting perf data;
# steady-state performance is within measurement noise of `release`.
[profile.profiling]
inherits = "release"
debug = 1
strip = "none"
split-debuginfo = "off"   # embed symbols in the binary so the perf bundle is self-contained
